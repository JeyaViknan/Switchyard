# Cut a release by pushing a tag:
#
#     git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Everything below keys off that tag. Nothing publishes from a branch, so a
# merge to main can never ship a version by accident.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release runs the same gate as every pull request. A tag is not a reason
  # to skip the tests; it is the reason to be sure of them.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev,bench]"
      - run: ruff check src tests
      - run: mypy src/switchyard/core src/switchyard/adapters src/switchyard/types.py
      - run: pytest -q
      # The product's own claim about itself, checked before it is shipped.
      - run: switchyard check

  build:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      # Read the version off the artifact that was actually built, not out of
      # pyproject.toml: the version is dynamic (hatchling reads it from
      # src/switchyard/__init__.py), so pyproject has no version key to read.
      # Checking the built wheel also verifies the thing being published
      # rather than a declaration about it.
      - name: Check the tag matches the version that was built
        if: github.ref_type == 'tag'
        run: |
          built=$(basename "$(ls dist/*.whl | head -1)" | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match built version $built"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches built version $built"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    # Opt-in. Trusted publishing has to be configured on PyPI before this can
    # work, and until it is, a hard dependency here fails the job and takes
    # the GitHub release with it -- which is what happened on the first v0.1.0
    # tag. Set the repository variable PUBLISH_PYPI=true once the trusted
    # publisher exists.
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no long-lived API token stored in the repository to leak.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # Deliberately not waiting on pypi. The container image and the release
    # notes are useful on their own; coupling them to an optional publish
    # meant one unconfigured registry suppressed both.
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install:

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            The wheel and sdist are attached below. PyPI publication is
            opt-in via the `PUBLISH_PYPI` repository variable; when it is on,
            `pip install switchyard-gateway` works too.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
