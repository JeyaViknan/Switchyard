# 15s scrape, not the 1s the development stack uses.
#
# The dev interval is deliberately aggressive so fault-injection experiments
# can resolve a recovery timeline in seconds. On the instance that would be
# 15x the samples for a dashboard nobody is watching most of the time, on a
# box with 1 GB of RAM and a 30 GB disk shared with everything else.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: switchyard-free-tier

scrape_configs:
  - job_name: switchyard-gateway
    # /metrics is admin-protected because its series are labelled per tenant
    # and therefore carry every tenant's usage and budget position. The
    # credential is read from a root-only file written out of SSM at deploy
    # time, never from this file -- this one is in git.
    authorization:
      credentials_file: /etc/prometheus/scrape-key
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
