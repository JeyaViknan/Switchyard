# Layered over compose.prod.yml to run the production stack on a laptop:
#
#     make prod-local
#
# One difference, and only one: the image is built from this checkout instead
# of pulled by commit SHA. Everything else -- service topology, ports, health
# checks, retention, drain timing -- is identical, which is the point. This is
# the rehearsal, not a different play.
#
# Paths come from SWITCHYARD_ENV_DIR / _CONFIG_FILE / _STATE_DIR, which
# `make prod-local` points at deploy/local/. They are variables rather than
# overrides here because Compose merges env_file lists instead of replacing
# them, so an override would require both locations to exist.

services:
  fleet:
    build: { context: .., dockerfile: Dockerfile }
    image: switchyard:local

  gateway:
    build: { context: .., dockerfile: Dockerfile }
    image: switchyard:local

  console:
    build: { context: .., dockerfile: Dockerfile }
    image: switchyard:local
