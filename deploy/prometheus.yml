# 1s scrape interval. Far more aggressive than a production default, and
# deliberate: fault-injection experiments need to resolve a recovery timeline in
# seconds, and a 15s interval would smear the transition being measured.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: switchyard-gateway
    # /metrics is protected because its series are labelled per tenant and so
    # carry every tenant's usage and budget position.
    authorization:
      credentials: "sk_sy_admin_672e27a104b9ede9182f129f4b288395"
    static_configs:
      - targets: ["gateway:8000"]
