# The whole system, plus the instruments used to measure it.
#
# `--http httptools --loop uvloop` is explicit rather than left to uvicorn's
# auto-detection so the container and local runs use the same event loop and
# HTTP parser; a benchmark comparing the two would otherwise be comparing
# runtimes as much as code.

services:
  fleet:
    build: .
    command: >
      uvicorn switchyard.synthetic.app:app --host 0.0.0.0 --port 8100
      --loop uvloop --http httptools --no-access-log
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: >
      uvicorn switchyard.gateway.app:create_app --factory
      --host 0.0.0.0 --port 8000 --loop uvloop --http httptools --no-access-log
    environment:
      SWITCHYARD_FLEET_URL: http://fleet:8100
      SWITCHYARD_CONFIG: /app/switchyard.toml
      SWITCHYARD_LOG_FORMAT: json
      # Tenant spend, on a named volume. Without this a restart would hand
      # every tenant a fresh budget, which is not what a budget means.
      SWITCHYARD_STATE_FILE: /var/lib/switchyard/state.json
    volumes:
      # Mounted rather than baked into the image: configuration carries
      # credentials, and editing limits should not require a rebuild.
      - ./switchyard.toml:/app/switchyard.toml:ro
      - switchyard-state:/var/lib/switchyard
    ports: ["8000:8000"]
    depends_on:
      fleet: {condition: service_healthy}
    # Drain is 30s (gateway.drain_timeout_s). Docker sends SIGTERM, waits 10s
    # by default, then SIGKILLs -- which cut every drain short at a third of
    # its budget and killed in-flight streams the gateway was still finishing.
    # 40s leaves headroom for the final spend flush after the drain completes.
    stop_grace_period: 40s
    healthcheck:
      # Readiness here, not liveness: `depends_on: service_healthy` is asking
      # "can this take traffic yet", and a draining gateway cannot.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build: .
    command: >
      uvicorn switchyard.console.app:create_app --factory
      --host 0.0.0.0 --port 8080 --loop uvloop --http httptools --no-access-log
    environment:
      CONSOLE_GATEWAY_URL: http://gateway:8000
      CONSOLE_FLEET_URL: http://fleet:8100
      CONSOLE_PROMETHEUS_URL: http://prometheus:9090
      CONSOLE_GRAFANA_URL: http://localhost:3000
      CONSOLE_PUBLIC_API_URL: http://localhost:8000
      # Development keys, committed on purpose: see switchyard.toml.
      SWITCHYARD_ADMIN_KEY: sk_sy_admin_672e27a104b9ede9182f129f4b288395
      CONSOLE_DEMO_KEYS: '{"acme":"sk_sy_acme_b6525e6c60405226fc726bdda422dd2f","globex":"sk_sy_globex_834d97c4fbd22ebe7a67696345b8693f","initech":"sk_sy_initech_64b4a01257ee3b9d7b2caf98079f8886"}'
      CONSOLE_PASSWORD: demo
      CONSOLE_SESSION_SECRET: local-development-not-a-secret
    ports: ["8080:8080"]
    depends_on:
      gateway: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  # Survives `docker compose restart` and `up --build`. Removed by
  # `docker compose down -v`, which is why `make down` is the reset.
  switchyard-state:
