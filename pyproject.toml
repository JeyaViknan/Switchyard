[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard-gateway"
dynamic = ["version"]
description = "Multi-tenant LLM gateway: token-fair scheduling, hard budgets, and failover you can test"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JeyaViknan" }]
keywords = [
    "llm", "gateway", "proxy", "scheduler", "fair-queueing", "multi-tenancy",
    "rate-limiting", "openai", "vllm", "ollama", "admission-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]


dependencies = [
    "fastapi",
    "uvicorn[standard]",   # pulls uvloop + httptools; see docs/decisions.md
    "httpx",
    "prometheus-client",
    "orjson",
    "numpy",
]

[project.scripts]
switchyard = "switchyard.cli.main:main"

[project.optional-dependencies]
# Analysis is only needed to turn benchmark runs into figures. Kept out of the
# gateway's runtime deps so the service image stays small.
bench = ["pyarrow", "matplotlib"]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/JeyaViknan/Switchyard"
Source = "https://github.com/JeyaViknan/Switchyard"
Issues = "https://github.com/JeyaViknan/Switchyard/issues"
Changelog = "https://github.com/JeyaViknan/Switchyard/blob/main/CHANGELOG.md"
"Design notes" = "https://github.com/JeyaViknan/Switchyard/blob/main/docs/decisions.md"

[tool.hatch.version]
path = "src/switchyard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
# Scenario end-to-end tests start real servers and drive seconds of load, so
# they are excluded by default to keep the edit-test loop fast. `make test-all`
# runs everything.
addopts = "-m 'not slow'"
markers = ["slow: starts real services and runs load; excluded from the default run"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Strict only where correctness is load-bearing. The scheduler, limiter, and
# accounting code get full strictness; benchmark tooling and the synthetic
# provider do not, because they are instruments rather than the system.
[[tool.mypy.overrides]]
module = ["switchyard.core.*", "switchyard.adapters.*"]
disallow_untyped_defs = true
strict_equality = true
